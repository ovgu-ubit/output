<div [formGroup]="form">
  <mat-form-field appearance="fill" style="width: 100%;">
    <mat-label>{{this.name}}</mat-label>
    <input type="text" placeholder="Auswählen oder Eingeben" matInput [matAutocomplete]="auto"
      formControlName="input" (keydown.enter)="select($event.target)" #input_ent>
    @if (this.formComponent) {
      <button type="button" matSuffix mat-icon-button (click)="select(input_ent)"
        [matTooltip]="this.name+' bearbeiten'" [matTooltipShowDelay]="800">
        @if (this.exists) {
          @if (!this.disabled) {
            <mat-icon>edit</mat-icon>
          } @else {
            <mat-icon>remove_red_eye</mat-icon>
          }
        } @else {
          <mat-icon>save</mat-icon>
        }
      </button>
    }
    <mat-autocomplete #auto="matAutocomplete" (optionSelected)="selectedEnt($event)">
      @for (ent of this.filtered_ents | async; track ent) {
        <mat-option [value]="ent.last_name + ', '+ent.first_name">
          {{ent.last_name}}, {{ent.first_name}} @if (ent.orcid) {
          ({{ent.orcid}})
        }
      </mat-option>
    }
  </mat-autocomplete>
</mat-form-field>
</div>
