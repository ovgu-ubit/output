<nav class="navbar navbar-expand-sm navbar-light pt-1 overflow-hidden">
  <ol class="breadcrumb">
    @for (label of labels; track label; let i = $index) {
      <li class="breadcrumb-item" [ngClass]="{'active': i === this.labels.length-1}">
        @if (this.label) {
          <a class="bg-dark link-light text-decoration-none" [routerLink]="links?.[i]">{{label}}</a>
        }
        @if (!this.label) {
          <a class="bg-dark link-light text-decoration-none" [routerLink]="links?.[i]">{{label|titlecase}}</a>
        }
      </li>
    }
  </ol>
</nav>
