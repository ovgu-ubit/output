<mat-toolbar class="primary-toolbar window-toolbar">
  <div class="window-toolbar-heading">
    <h1>{{this.name}}</h1>
    <ng-content select="[windowToolbarTags]"></ng-content>
  </div>
  <div class="window-toolbar-actions">
    @if (this.maximizeable) {
      <button mat-icon-button (click)="this.parent.toggleMaximize()"
        [matTooltip]="this.parent.isMaximized ? 'Fenster wiederherstellen' : 'Fenster maximieren'"
        [matTooltipShowDelay]="800">
        @if (this.parent.isMaximized) {
          <mat-icon>close_fullscreen</mat-icon>
        }
        @if (!this.parent.isMaximized) {
          <mat-icon>open_in_full</mat-icon>
        }
      </button>
    }
    @if (this.lockable) {
      <button mat-icon-button (click)="this.parent.lock()" [matTooltip]="this.name + ' (ent)sperren'" [matTooltipShowDelay]="800"
        [disabled]="this.disabled">
        @if (this.parent.pub?.locked) {
          <mat-icon>lock</mat-icon>
        }
        @if (!this.parent.pub?.locked) {
          <mat-icon>lock_open</mat-icon>
        }
      </button>
    }
    @if (!this.disabled) {
      <div>
        <button mat-icon-button (click)="this.parent.action()" [matTooltip]="this.name + ' speichern'"
          [attr.aria-label]="this.name + ' speichern'"
          [matTooltipShowDelay]="800"><mat-icon>save</mat-icon></button>
          <button mat-icon-button (click)="this.parent.abort()" matTooltip="Abbrechen"
            aria-label="Abbrechen"
            [matTooltipShowDelay]="800"><mat-icon>close</mat-icon></button>
          </div>
        } @else {
          <button mat-icon-button (click)="this.parent.close()" matTooltip="Schließen"
            aria-label="Schließen"
            [matTooltipShowDelay]="800"><mat-icon>close</mat-icon></button>
          }
        </div>
      </mat-toolbar>
