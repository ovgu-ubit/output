<app-breadcrump [path]="getLink()" [label]="getLabel()"></app-breadcrump>
<div class="jumbotron">
  <div class="container-fluid">
    <mat-accordion>
      @for (im of this.enrichs; track im; let idx = $index) {
        <mat-expansion-panel>
          <mat-expansion-panel-header>
            <mat-panel-title>
              {{im.label}}
            </mat-panel-title>
            <mat-panel-description>
              Status: {{status[idx]}}
            </mat-panel-description>
          </mat-expansion-panel-header>
          <mat-checkbox #filter>Aktuellen Filter verwenden</mat-checkbox> &nbsp;
          @if (im.path === 'excel') {
            <mat-checkbox #master_data>Stammdaten mit exportieren</mat-checkbox>
            } &nbsp;
            <button mat-raised-button (click)="this.startImport(im)" class="primary-button">Export starten</button>
            <table style="width: 100%;">
              <tr>
                <th>Dateiname</th>
                <th>Anzeigen</th>
                <th>Löschen</th>
              </tr>
              @for (rep of this.getReports(im.label); track rep) {
                <tr>
                  <td>{{rep}}</td>
                  <td><button mat-icon-button (click)="openLog(rep)"><mat-icon>remove_red_eye</mat-icon></button></td>
                  <td><button mat-icon-button (click)="delete(rep)"><mat-icon>delete</mat-icon></button></td>
                </tr>
              }
            </table>
          </mat-expansion-panel>
        }

      </mat-accordion>
    </div></div>
