<mat-dialog-content>
  <div class="container-fluid">
    <h3>{{data.label}}</h3>
    <div style="display: flex;justify-content: space-between;">
      <mat-checkbox [(ngModel)]="this.showErr">Nur Warnungen und Fehler anzeigen</mat-checkbox>
      <button mat-icon-button matTooltip="Log herunterladen"
        (click)="downloadRep();"><mat-icon>download</mat-icon></button>
      </div>
      <div>
        @for (line of text; track line) {
          <div style="background-color: lightgray;font-size: medium;">
            @if (!this.showErr || line.includes('[error]') || line.includes('[warning]')) {
              <div [class]="line.includes('[error]')? 'error' : (line.includes('[warning]')? 'warning':'')"
              >{{line}}</div>
            }
          </div>
        }
      </div></div>
    </mat-dialog-content>
